olbar{display:none}.light{background:#eff5f4;color:#18343a}.light #toolbar{background:#eff5f4}.light button,.light select{background:#fff;color:#18343a}.suspended{visibility:hidden}

#document-chrome{height:0;padding:0;border:0;background:transparent;overflow:visible;pointer-events:none}#document-zoom{position:absolute;right:12px;top:8px;background:#fffffff0;border:1px solid #ccd6da;border-radius:6px;padding:3px 5px;box-shadow:0 2px 6px #0002;pointer-events:auto}#save-status{position:fixed;bottom:8px;left:12px;max-width:calc(100% - 24px);padding:5px 9px;border-radius:5px;background:#17252ae8;color:#eff5f5;font-size:11px;line-height:1.4;pointer-events:none;z-index:3;white-space:pre-wrap}#save-status:empty{display:none}

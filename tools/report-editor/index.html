<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'"><style>__CSS__</style></head><body>
<div id="toolbar" role="toolbar" aria-label="Report formatting">
<select id="heading" title="Paragraph style"><option value="p">Paragraph</option><option value="1">Heading 1</option><option value="2">Heading 2</option><option value="3">Heading 3</option></select>
<select id="font" title="Font"><option value="Arial">Arial</option><option value="Georgia">Georgia</option><option value="Courier New">Courier New</option></select><select id="size" title="Font size"><option>12px</option><option>14px</option><option selected>16px</option><option>18px</option><option>24px</option><option>32px</option></select>
<button data-command="bold" data-mark="bold" title="Bold (Ctrl/⌘ B)"><b>B</b></button><button data-command="italic" data-mark="italic" title="Italic (Ctrl/⌘ I)"><i>I</i></button><button data-command="underline" data-mark="underline" title="Underline (Ctrl/⌘ U)"><u>U</u></button>
<span id="color-control"><button id="color" title="Text color" aria-label="Text color" aria-expanded="false" aria-controls="color-palette">A<span class="color-line"></span></button><span id="color-palette" role="group" aria-label="Choose text color" hidden><span id="color-swatches"></span><span class="custom-color-row"><input id="custom-color" aria-label="Custom hex color" placeholder="#FF0000" maxlength="7"><button id="apply-color">Apply</button></span></span></span><select id="align" title="Alignment"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select>
<button data-command="bulletList" data-mark="bulletList" title="Bullet list">• List</button><button data-command="orderedList" data-mark="orderedList" title="Numbered list">1. List</button><button id="image" title="Insert image">Image</button><button data-command="table" title="Insert table">Table</button><button data-command="deleteTable" title="Remove selected table">− Table</button><button data-command="undo" title="Undo">↶</button><button data-command="redo" title="Redo">↷</button><button data-command="clear" title="Clear formatting">Clear</button>
<input type="file" id="file" accept="image/png,image/jpeg,image/webp" multiple hidden></div>
<div id="notice" role="status" aria-live="polite"></div><main><div id="document-chrome"><div id="document-zoom" role="group" aria-label="Document zoom"><button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button><output id="zoom-value" aria-live="polite">100%</output><button id="zoom-in" title="Zoom in" aria-label="Zoom in" disabled>+</button></div></div><div id="document-viewport"><div id="public"></div></div></main><div id="save-status" role="status" aria-live="polite"></div><script>__JS__</script></body></html>
